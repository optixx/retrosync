name: Build Executables

on:
  workflow_dispatch:  # This allows the workflow to be triggered manually

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --all-groups --python 3.12
          uv pip install pyinstaller==6.22.3

      - name: Build executable
        run: uv run pyinstaller --onefile retrosync.py

      - name: Create zip
        shell: powershell
        run: |
          powershell Compress-Archive -Path './dist/*' -DestinationPath './retrosync-windows-x64-release.zip'

      - name: Get Version
        id: get_version
        shell: powershell
        run: |
          $content = Get-Content VERSION -Raw
          "file_content=$content" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: ./retrosync-windows-x64-release.zip

      - name: Upload Windows executable
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.file_content }}
          files: ./retrosync-windows-x64-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --all-groups --python 3.12
          uv pip install pyinstaller==6.22.3

      - name: Build executable
        run: uv run pyinstaller --onefile retrosync.py

      - name: Create zip
        run: zip -r ./retrosync-macos-release.zip ./dist/retrosync

      - name: Get Version
        id: get_version
        run: |
          current_version=$(cat VERSION)
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-executable
          path: ./retrosync-macos-release.zip

      - name: Upload macOS executable
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.current_version }}
          files: ./retrosync-macos-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
