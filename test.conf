[default]
transport = "filesystem"

src_retroarch_base = "tests/assets"
src_roms = ["tests/assets/roms"]
src_flavor = "apple"

dest_retroarch_base = "/tmp/retrosync-test/retroarch"
dest_roms = "/tmp/retrosync-test/roms"

target_roms = "/tmp/retrosync-test/roms"
target_cores = "/tmp/retrosync-test/retroarch/cores"
target_flavor = "linux"

[ssh]
hostname = "steamdeck"
username = ""
password = ""

[webdav]
url = ""
username = ""
password = ""

[[shaders]]
name = "Atari - 2600 (Stella)"
shader = "crt/crt-easymode.slangp"

[[shaders]]
name = "Sharp - X68000 (PX68k)"
shader = "crt/crt-guest-advanced.slangp"

[[shaders]]
name = "Commodore - Amiga (PUAE)"
shader = "crt/crt-guest-advanced.slangp"


[[playlists]]
name = "test.lpl"
src_folder = "test"
dest_folder = "atari2600"
src_core_path = "stellalibretro"
src_core_name = "Atari - 2600 (Stella)"

[[playlists]]
name = "test.lpl"
src_folder = "test"
src_whitelist = '.*FD.*\.zip$'
src_blacklist = '.*HD.*\.zip$'
dest_folder = "x68000"
src_core_path = "px68k_libretro"
src_core_name = "Sharp - X68000 (PX68k)"

[[playlists]]
name = "test.lpl"
src_folder = "test"
src_whitelist = '\.m3u$'
src_blacklist = '\.adf$'
src_create_m3u = true
src_m3u_whitelist = '\.adf$'
src_m3u_pattern = '(.*)(\(Disk \d of \d\)).*\.adf'
dest_folder = "amiga"
src_core_path = "puae_libretro"
src_core_name = "Commodore - Amiga (PUAE)"
